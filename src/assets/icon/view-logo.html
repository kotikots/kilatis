<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KILATIS - Official Logo Assets (White Background Edition)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 40px 20px;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      margin: 0 0 10px;
      color: #1b5e20;
    }
    p {
      color: #666;
      margin: 0;
    }
    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      max-width: 900px;
      width: 100%;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #e0e0e0;
    }
    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #1b5e20;
      margin-bottom: 16px;
      align-self: flex-start;
    }
    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px dashed #cfd8dc;
    }
    .logo-container img {
      max-width: 100%;
      height: auto;
    }
    .badge-container {
      width: 260px;
      height: 260px;
    }
    .badge-container img {
      width: 100%;
      height: 100%;
    }
    .action-links {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
    .btn {
      display: inline-block;
      padding: 9px 18px;
      background: #2e7d32;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1b5e20;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>KILATIS Brand Identity Assets</h1>
    <p>White Background Edition &bull; Palengke Price Watch &amp; Consumer Guide &bull; Nueva Ecija</p>
  </div>

  <div class="card-grid">
    <!-- Horizontal Banner Logo -->
    <div class="card">
      <div class="card-title">1. Primary Horizontal Banner Logo (White Background)</div>
      <div class="logo-container">
        <img src="kilatis-logo.svg" alt="KILATIS Horizontal Logo (White BG)">
      </div>
      <div class="action-links">
        <a class="btn" href="kilatis-logo.svg" download="kilatis-logo.svg">Download SVG</a>
      </div>
    </div>

    <!-- Square App Icon / Badge -->
    <div class="card">
      <div class="card-title">2. Square App Icon / Badge (White Background)</div>
      <div class="logo-container" style="background: transparent; border: none;">
        <div class="badge-container">
          <img src="kilatis-icon.svg" alt="KILATIS App Icon (White BG)">
        </div>
      </div>
      <div class="action-links">
        <a class="btn" href="kilatis-icon.svg" download="kilatis-icon.svg">Download Icon SVG</a>
      </div>
    </div>
  </div>

</body>
</html>
